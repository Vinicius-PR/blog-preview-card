<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Blog preview card</title>
</head>
<body>

  <main>
    
    <header>
      <img class="main-img" src="/assets/images/illustration-article.svg" alt="Blog preview image">
    </header>

    <article class="blog-preview-container">
      <p class="blog-tag text-preset-3-bold">Learning</p>

      <h2 class="text-preset-3">Published 21 Dec 2023</h2>

      <h1 class="text-preset-1 title-hover">HTML & CSS foundations</h1>

      <div class="preview-text">
        <p class="text-preset-2">
          These languages are the backbone of every website, defining structure, content, and presentation.
        </p>
      </div>
    </article>

    <footer>
      <img src="/assets/images/image-avatar.webp" alt="Avatar Image" class="avatar-img">
      <h2 class="text-preset-3-bold">Greg Hooper</h2>
    </footer>

  </main>

</body>
</html>
