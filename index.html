<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Blog preview card</title>
</head>
<body>

  <div class="blog-container">
    <figure class="img-container">
      <img class="main-img" src="/assets/images/illustration-article.svg" alt="Blog preview image">
    </figure>
    
    <main>
      <article class="blog-preview-container">
        <span class="blog-tag text-preset-3-bold">Learning</span>

        <h2 class="text-preset-3">Published <time datetime="2023-12-21">21 Dec 2023</time></h2>

        <h1 class="text-preset-1 title-hover">HTML & CSS foundations</h1>

        <div class="preview-text">
          <p class="text-preset-2">
            These languages are the backbone of every website, defining structure, content, and presentation.
          </p>
        </div>
      </article>
    </main>

    <footer>
      <img src="/assets/images/image-avatar.webp" alt="Avatar Image" class="avatar-img">
      <h2 class="text-preset-3-bold">Greg Hooper</h2>
    </footer>
  </div>

</body>
</html>
